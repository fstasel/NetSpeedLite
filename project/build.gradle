plugins {
    id 'com.android.application'
}

android {
    namespace 'io.netspeed.lite'
    compileSdk 34

    defaultConfig {
        applicationId 'io.netspeed.lite'
        minSdk 34
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Zero external dependencies — pure Android SDK API 34 framework classes only
}
